version: '3.8'

services:
  speech-ai:
    build: .
    runtime: nvidia  # Enable NVIDIA GPU support
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./models:/app/models
    environment:
      - S3_ENABLED=0  # Set to 1 if using S3
      - PYANNOTE_MODEL=pyannote/speaker-diarization-3.1
      - WHISPER_MODEL=large-v3
      - TRANSCRIPTION_MODE=quality
      - GIGAAM_MODEL_TYPE=v3_e2e_rnnt
      - ASR_PRIMARY=gigaam
      - PARALLEL_WORKERS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]